[package]
name = "cronus-lang"
version = "0.1.0"
edition = "2021"
authors = ["Zedd <contact@cooud.com>"]
description = "The declarative language that replaces your entire web stack. One .cronus file = full-stack app."
license = "MIT"
repository = "https://github.com/cronusmaster/cronus-kernel"
homepage = "https://github.com/cronusmaster/cronus-kernel"
readme = "README.md"
keywords = ["web", "framework", "declarative", "fullstack", "language"]
categories = ["web-programming", "development-tools"]
exclude = ["target/", ".git/", "tests/", "examples/"]
build = "build.rs"

[[bin]]
name = "cronus"
path = "src/main.rs"

[features]
default = ["dump"]
# `cronus dump` (HTML / Next.js / Prisma / OpenAPI → .cronus) and
# `cronus audit logic` (DOM fixture parity). Both need the scraper HTML parser.
dump = ["dep:scraper"]

[dependencies]
# Minimal feature sets: only what src/ uses (tokio::main/test/select!, TcpListener,
# lookup_host, time, broadcast, AsyncRead/WriteExt, ctrl_c; hyper HTTP/1 server).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
bytes = "1"
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["rand"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
async-stream = "0.3"
futures-core = "0.3"
scraper = { version = "0.22", optional = true }
base64 = "0.22"
regex = "1"

[dev-dependencies]
# http_dispatch_tests.rs drives the server with hyper's HTTP/1 client.
hyper = { version = "1", features = ["client"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "unwind"  # a panic in one request must not kill the server (http_guard::isolate_panics)
