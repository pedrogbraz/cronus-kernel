[package]
name = "cronus-lang"
version = "0.1.0"
edition = "2021"
authors = ["Zedd <contact@cooud.com>"]
description = "The declarative language that replaces your entire web stack. One .cronus file = full-stack app."
license = "MIT"
repository = "https://github.com/eozedd/kronus"
homepage = "https://github.com/eozedd/kronus"
readme = "README.md"
keywords = ["web", "framework", "declarative", "fullstack", "language"]
categories = ["web-programming", "development-tools"]
exclude = ["target/", ".git/", "tests/", "examples/"]

[[bin]]
name = "cronus"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
bytes = "1"
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["rand"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
async-stream = "0.3"
tokio-stream = "0.1"
futures-core = "0.3"
scraper = "0.22"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
strip = true
