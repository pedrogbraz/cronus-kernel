name: kernel-ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --locked

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Fails only on deny-by-default lints (clippy::correctness) and hard errors.
      # ~291 warnings remain (style/complexity/perf); tighten once they are burned down.
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D clippy::correctness

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true # flips to required after the repo-wide fmt commit
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --release --locked
      - name: binary size budget (12 MB)
        run: |
          max=$((12 * 1024 * 1024))
          size=$(stat -c %s target/release/cronus)
          echo "target/release/cronus: ${size} bytes (budget ${max})"
          if [ "$size" -gt "$max" ]; then
            echo "::error::release binary is ${size} bytes, over the 12 MB budget"
            exit 1
          fi
